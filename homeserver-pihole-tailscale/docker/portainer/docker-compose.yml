# Portainer CE zur Verwaltung von Containern und Stacks im Browser
# Achtung: Portainer hat Zugriff auf den Docker Socket und damit volle Kontrolle
# über den Server. Deshalb nur an die LAN Adresse binden.

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: always
    ports:
      - "${SERVER_LAN_IP:-192.168.137.10}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
