# Pi-hole als netzwerkweiter DNS Werbeblocker
# Port 53 wird nur auf der LAN und der Tailscale Adresse gebunden,
# damit der DNS Server niemals aus fremden Netzen erreichbar ist.

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    dns:
      - 127.0.0.1
      - 1.1.1.1
    ports:
      - "${SERVER_LAN_IP}:53:53/tcp"
      - "${SERVER_LAN_IP}:53:53/udp"
      - "${TAILSCALE_IP}:53:53/tcp"
      - "${TAILSCALE_IP}:53:53/udp"
      - "${SERVER_LAN_IP}:8080:80/tcp"
    environment:
      TZ: "${TZ}"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
    volumes:
      - pihole-data:/etc/pihole

volumes:
  pihole-data:
